<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FyberNet Academy | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <div class="logo-area">

                <div class="logo-icon">
                    F
                </div>

                <h1>FyberNet Academy</h1>

                <p>
                    Plataforma de treinamento corporativo
                </p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="usuario">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <button type="submit" class="btn-primary">
                    Entrar na plataforma
                </button>

                <p id="loginErro" class="login-error"></p>

            </form>

            <div class="login-footer">

                <small>
                    Ambiente de treinamento interno
                </small>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
